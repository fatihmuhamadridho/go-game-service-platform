$kind: http-example
name: Login rate limit reached
order: 4000
request:
  method: POST
  url: http://localhost:8080/api/admin/auth/v1/login
  headers:
    - key: Origin
      value: http://localhost:3000
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "identifier": "{{identifier}}",
        "password": "{{password}}"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
    - key: Cache-Control
      value: no-store
    - key: Retry-After
      value: "900"
  body:
    type: json
    content: |-
      {
        "code": "ADMB02002",
        "message": "Batas rate limit tercapai.",
        "data": null
      }
