$kind: http-example
name: Invalid credentials
order: 2000
request:
  method: POST
  url: http://localhost:8080/api/admin/auth/v1/login
  headers:
    - key: Origin
      value: http://localhost:3000
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "identifier": "{{identifier}}",
        "password": "{{password}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
    - key: Cache-Control
      value: no-store
  body:
    type: json
    content: |-
      {
        "code": "ADMB01001",
        "message": "Username/email atau password tidak valid.",
        "data": null
      }
