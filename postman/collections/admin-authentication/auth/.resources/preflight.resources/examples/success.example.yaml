$kind: http-example
name: Admin auth preflight accepted
order: 1000
request:
  method: OPTIONS
  url: http://localhost:8080/api/admin/auth/v1/login
  headers:
    - key: Origin
      value: http://localhost:8080
    - key: Access-Control-Request-Method
      value: POST
    - key: Access-Control-Request-Headers
      value: content-type, x-request-id
response:
  statusCode: 204
  statusText: No Content
  headers:
    - key: Access-Control-Allow-Origin
      value: http://localhost:8080
    - key: Access-Control-Allow-Credentials
      value: 'true'
    - key: Access-Control-Allow-Methods
      value: 'POST, OPTIONS'
    - key: Access-Control-Allow-Headers
      value: 'Content-Type, X-CSRF-Token, X-Request-Id'
  body:
    type: text
    content: ''
