$kind: http-example
name: Refresh session is invalid
order: 2000
request:
  method: POST
  url: http://localhost:8080/api/admin/auth/v1/refresh-token
  headers:
    - key: Origin
      value: http://localhost:3000
    - key: X-CSRF-Token
      value: "{{csrfToken}}"
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
    - key: Cache-Control
      value: no-store
    - key: Set-Cookie
      value: __Host-jokihub-admin-access=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=None
    - key: Set-Cookie
      value: __Host-jokihub-admin-refresh=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=None
  body:
    type: json
    content: |-
      {
        "code": "ADMB01003",
        "message": "Session tidak valid atau telah berakhir.",
        "data": null
      }
