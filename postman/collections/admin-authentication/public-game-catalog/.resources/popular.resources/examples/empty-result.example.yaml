$kind: http-example
name: No popular games available
order: 3000
request:
  method: GET
  url: http://localhost:8080/api/games/v1/popular?page=1&limit=6
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
    - key: Cache-Control
      value: no-store
  body:
    type: json
    content: |-
      {
        "code": "GAMS00000",
        "message": "Popular games retrieved",
        "data": [],
        "pagination": {"page": 1, "limit": 6, "total": 0, "totalPages": 0}
      }
