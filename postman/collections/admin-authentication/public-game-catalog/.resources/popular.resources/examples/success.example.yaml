$kind: http-example
name: Popular Games
request:
  method: GET
  url: '{{baseUrl}}/api/games/v1/popular?page=1&limit=6'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
    - key: Cache-Control
      value: no-store
  body:
    type: json
    content: |-
      {
        "code": "GAMS00000",
        "message": "Popular games retrieved",
        "data": [
          {
            "id": "game_01ARZ3NDEKTSV4RRFFQ69G5FAV",
            "name": "Mobile Legends",
            "slug": "mobile-legends",
            "description": "Permainan strategi untuk perangkat seluler",
            "imageUrl": "https://cdn.example.test/images/games/mobile-legends.webp",
            "platform": "MOBILE",
            "sortOrder": 2
          }
        ],
        "pagination": {
          "page": 1,
          "limit": 6,
          "total": 1,
          "totalPages": 1
        }
      }
