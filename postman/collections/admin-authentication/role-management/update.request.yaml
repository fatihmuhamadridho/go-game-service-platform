$kind: http-request
name: Update Role
order: 4000
method: PUT
url: '{{baseUrl}}/api/admin/roles/v1/update/{{roleId}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: '{{dashboardOrigin}}'
  - key: X-CSRF-Token
    value: '{{csrfToken}}'
body:
  type: json
  content: |-
    {
      "description": "Updated support access",
      "permissions": ["role.read", "game.read"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Update returns HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Update returns success envelope', function () {
        const body = pm.response.json();
        pm.expect(body.code).to.eql('ROLS00000');
        pm.expect(body).to.have.property('data', null);
      });
      pm.test('Response is not cached', function () { pm.expect(pm.response.headers.get('Cache-Control')).to.include('no-store'); });
examples: './.resources/update.resources/examples/'
