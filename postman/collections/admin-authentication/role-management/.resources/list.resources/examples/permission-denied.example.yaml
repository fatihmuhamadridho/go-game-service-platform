$kind: http-example
name: Role read permission denied
order: 3000
request:
  method: GET
  url: http://localhost:8080/api/admin/roles/v1/list?page=1&limit=10
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
    - key: Cache-Control
      value: no-store
  body:
    type: json
    content: |-
      {"code":"ROLB01002","message":"Akses role tidak diizinkan.","data":null}
