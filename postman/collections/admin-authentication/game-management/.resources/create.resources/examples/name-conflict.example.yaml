$kind: http-example
name: Duplicate name slug or sort order
order: 2000
request:
  method: POST
  url: http://localhost:8080/api/admin/games/v1/create
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
    - key: Cache-Control
      value: no-store
  body:
    type: json
    content: |-
      {
        "code": "GAMB02002",
        "message": "Game name, slug, or sortOrder is already in use.",
        "data": null
      }
