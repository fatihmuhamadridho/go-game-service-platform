$kind: http-example
name: List games with pagination
order: 1000
request:
  method: GET
  url: http://localhost:8080/api/admin/games/v1/list?page=1&limit=20
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
    - key: Cache-Control
      value: no-store
  body:
    type: json
    content: |-
      {
        "code": "GAMS00000",
        "message": "Games retrieved",
        "data": [
          {
            "id": "game_01ARZ3NDEKTSV4RRFFQ69G5FAV",
            "name": "Example Game",
            "slug": "example-game",
            "description": null,
            "imageUrl": "https://cdn.example.test/example-game.webp",
            "platform": "MOBILE",
            "isActive": false,
            "isPopular": false,
            "sortOrder": 0,
            "createdAt": "2026-10-25T00:00:00Z",
            "updatedAt": "2026-10-25T00:00:00Z"
          }
        ],
        "pagination": {
          "page": 1,
          "limit": 20,
          "total": 1,
          "totalPages": 1
        }
      }
