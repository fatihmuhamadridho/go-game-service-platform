$kind: http-request
name: Preflight Game Update
order: 6000
method: OPTIONS
url: '{{baseUrl}}/api/admin/games/v1/update/{{gameId}}'
headers:
  - key: Origin
    value: '{{dashboardOrigin}}'
  - key: Access-Control-Request-Method
    value: PATCH
  - key: Access-Control-Request-Headers
    value: content-type, x-csrf-token
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Game update preflight is accepted', function () { pm.response.to.have.status(204); });
      pm.test('Game preflight allows the requested method and headers', function () {
        pm.expect(pm.response.headers.get('Access-Control-Allow-Origin')).to.eql(pm.environment.get('dashboardOrigin'));
        pm.expect(pm.response.headers.get('Access-Control-Allow-Methods')).to.include('PATCH');
        pm.expect(pm.response.headers.get('Access-Control-Allow-Headers').toLowerCase()).to.include('x-csrf-token');
      });
examples: './.resources/preflight.resources/examples/'
